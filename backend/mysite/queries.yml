insert_expense: |
  INSERT INTO expense.expenses (amount, description, category)
  VALUES (:amount, :description, :category )
  RETURNING amount, description, category

get_expenses: |
  SELECT * FROM expense.expenses ORDER BY created_at DESC

delete_expense: |
  DELETE FROM expense.expenses WHERE id = :id 
  RETURNING amount, description, category

edit_expense: |
  UPDATE  expense.expenses 
  SET amount = :amount, description = :description, category = :category
  WHERE id = :id
  RETURNING amount, description, category 

get_user_id: |
  SELECT id, email FROM users WHERE firebase_uid = :firebase_uid

create_user: |
  INSERT INTO users (firebase_uid, email)
  VALUES (:firebase_uid, :email)
  RETURNING  id, email